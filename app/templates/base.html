<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AURA{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800;900&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
{% block navbar %}
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <span class="logo-icon">◆</span>
            </a>
            <div class="nav-toggle" id="navToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li class="nav-item">
                    <a href="/" class="nav-link active">
                        <span class="link-label">首页</span>
                        <span class="link-indicator"></span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/about" class="nav-link">
                        <span class="link-label">关于</span>
                        <span class="link-indicator"></span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/dashboard" class="nav-link">
                        <span class="link-label">数据看板</span>
                        <span class="link-indicator"></span>
                    </a>
                </li>
                <li class="nav-item nav-cta">
                    <a href="/about" class="cta-button">
                        <span>开始探索</span>
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </li>
            </ul>
        </div>
    </nav>
    {% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-brand">
                <span class="logo-icon">◆</span>
                <span>AURA</span>
            </div>
            <p class="footer-text">Intelligent Energy Monitoring Platform</p>
            <div class="footer-divider"></div>
            <p class="footer-copy">&copy; 2026 AURA. All rights reserved.</p>
        </div>
    </footer>

    <div class="cursor-glow" id="cursorGlow"></div>
    <canvas id="particleCanvas"></canvas>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
